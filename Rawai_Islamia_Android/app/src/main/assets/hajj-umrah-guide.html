<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مناسك الحج والعمرة</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>مناسك الحج والعمرة</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🕋 مناسك الحج والعمرة</h1><p>دليل تعليمي مرتب، والتفاصيل التي فيها خلاف فقهي يُرجع فيها إلى أهل العلم.</p></section><div id="list"></div></main><script src="script.js"></script><script>const a=[['العمرة','الإحرام من الميقات، ثم الطواف بالبيت، ثم السعي بين الصفا والمروة، ثم الحلق أو التقصير.'],['الحج: الإحرام','ينوي الحاج النسك من الميقات ويلبي، مع الالتزام بمحظورات الإحرام.'],['يوم التروية','يتوجه الحاج إلى منى في اليوم الثامن من ذي الحجة بحسب نسكه.'],['عرفة','الوقوف بعرفة ركن عظيم من أركان الحج، ويُكثر الحاج من الدعاء والذكر.'],['مزدلفة ومنى','بعد الإفاضة من عرفة يُذكر الله ويبيت الحاج بمزدلفة وفق نسكه، ثم يرمي الجمرات في أيام التشريق.'],['طواف الإفاضة والوداع','طواف الإفاضة من أعمال الحج، وطواف الوداع يكون عند مغادرة مكة لمن وجب عليه.']];list.innerHTML=a.map((x,i)=>'<article class="tool-section"><h2>'+(i+1)+'. '+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');</script></body></html>
