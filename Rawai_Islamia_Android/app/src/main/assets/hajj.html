<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحج والعمرة - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>الحج والعمرة</small></span></a></header><main class="inside tools-page"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero tools-hero"><small>مناسك</small><h1>🕋 الحج والعمرة</h1><p>دليل مختصر مرتب للمراحل الأساسية، مع التنبيه إلى الرجوع إلى المصادر الموثوقة وأهل العلم في التفاصيل.</p></section><section class="tool-section"><h2>العمرة</h2><div id="umrah"></div></section><section class="tool-section"><h2>الحج</h2><div id="hajj"></div></section><section class="tool-section"><h2>مراجع قرآنية</h2><p>قال تعالى: <b>﴿وأتموا الحج والعمرة لله﴾</b> [البقرة: 196].</p><p>قال تعالى: <b>﴿الحج أشهر معلومات﴾</b> [البقرة: 197].</p></section></main><script src="script.js"></script><script>const u=['الإحرام من الميقات والتلبية','دخول مكة والطواف حول الكعبة سبعة أشواط','السعي بين الصفا والمروة سبعة أشواط','الحلق أو التقصير والتحلل'];const h=['الإحرام والتلبية','الوقوف بعرفة في يوم عرفة','المبيت بمزدلفة ورمي جمرة العقبة','التحلل والطواف والسعي بحسب النسك','أيام منى ورمي الجمرات','طواف الوداع عند مغادرة مكة لمن يلزمه'];function list(id,a){document.getElementById(id).innerHTML=a.map((x,i)=>'<label class="wird-list" style="display:block;margin:10px 0"><input type="checkbox" data-man="'+id+i+'"> '+(i+1)+'. '+x+'</label>').join('')}list('umrah',u);list('hajj',h);</script></body></html>
