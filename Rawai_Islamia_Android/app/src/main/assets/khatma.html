<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ختمة القرآن - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>ختمة القرآن</small></span></a><nav><a href="index.html">الرئيسية</a><a href="more.html">المزيد</a></nav></header><main class="inside tools-page"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero tools-hero"><small>عبادة يومية</small><h1>📖 ختمة القرآن الكريم</h1><p>حدد الجزء الذي وصلت إليه، وسيحفظ التطبيق تقدمك على جهازك.</p></section><section class="tool-section"><div class="tool-heading"><div><small>تقدمك</small><h2 id="pct">0%</h2></div></div><div style="height:18px;background:#e5ece9;border-radius:99px;overflow:hidden"><div id="bar" style="height:100%;width:0%;background:#087c68"></div></div><p id="info" style="text-align:center;margin:18px 0"></p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px" id="juz"></div><div style="display:flex;gap:10px;margin-top:18px"><button class="primary" onclick="setJuz(Math.min(30,current+1))">أنجزت جزءًا</button><button class="tool-mini" onclick="setJuz(0)">بدء ختمة جديدة</button></div></section></main><script src="script.js"></script><script>let current=Number(localStorage.getItem('rawai-khatma')||0);function setJuz(n){current=n;localStorage.setItem('rawai-khatma',n);render()}function render(){let p=Math.round(current/30*100);document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('info').textContent='أتممت '+current+' من 30 جزءًا';document.getElementById('juz').innerHTML=Array.from({length:30},(_,i)=>'<button class="tool-mini" style="padding:10px;background:'+(i<current?'#087c68':'')+';color:'+(i<current?'#fff':'')+'" onclick="setJuz('+(i+1)+')">الجزء '+(i+1)+'</button>').join('')}render();</script></body></html>
