<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أذكار متقدمة - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>أذكار متقدمة</small></span></a></header><main class="inside tools-page"><a class="back" href="adhkar.html">← الأذكار</a><section class="section-hero tools-hero"><small>ذكر الله</small><h1>📿 أذكار متقدمة</h1><p>اختر المجموعة، واضغط على الذكر لتسجيل العدد المنجز محليًا.</p></section><div id="groups"></div></main><script src="script.js"></script><script>const groups=[['أذكار الصباح',['أصبحنا وأصبح الملك لله.','اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.','رضيت بالله ربًا وبالإسلام دينًا وبمحمد ﷺ نبيًا.']],['أذكار المساء',['أمسينا وأمسى الملك لله.','اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير.','أعوذ بكلمات الله التامات من شر ما خلق.']],['الاستغفار',['أستغفر الله وأتوب إليه.','رب اغفر لي وتب علي إنك أنت التواب الرحيم.']],['الصلاة على النبي ﷺ',['اللهم صل وسلم وبارك على نبينا محمد ﷺ.']]];let state=JSON.parse(localStorage.getItem('rawai-adhkar-progress')||'{}');document.getElementById('groups').innerHTML=groups.map((g,gi)=>'<section class="tool-section"><div class="tool-heading"><h2>'+g[0]+'</h2></div>'+g[1].map((t,i)=>{let k=gi+'-'+i,n=state[k]||0;return '<div class="saved-item" style="margin:8px 0"><div><b>'+t+'</b><small>العدد: <span id="n-'+k+'">'+n+'</span></small></div><button class="primary" onclick="add(\''+k+'\')">+1</button></div>'}).join('')+'</section>').join('');function add(k){state[k]=(state[k]||0)+1;localStorage.setItem('rawai-adhkar-progress',JSON.stringify(state));document.getElementById('n-'+k).textContent=state[k]}</script></body></html>
