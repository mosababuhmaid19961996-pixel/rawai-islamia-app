<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأخلاق والآداب</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الأخلاق والآداب</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🌱 الأخلاق والآداب الإسلامية</h1><p>مبادئ عملية من القرآن والسنة في التعامل مع الله والناس.</p></section><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['بر الوالدين','الإحسان إلى الوالدين وصحبتهما بالمعروف.','الإسراء 23-24'],['الصدق','الصدق من أعظم الأخلاق، وقد أمر الله به مع الصادقين.','التوبة 119'],['الأمانة','أداء الأمانات إلى أهلها من أوامر القرآن.','النساء 58'],['حسن الجوار','الإحسان إلى الجار من مكارم الأخلاق.','النساء 36'],['العفو','العفو والصفح من الأخلاق التي حث عليها القرآن.','آل عمران 134'],['التواضع','نهى القرآن عن الكبر في المشي والكلام.','الإسراء 37'],['صلة الرحم','صلة الأقارب والإحسان إليهم من الأعمال العظيمة.','محمد 22-23'],['الرفق','الرفق في التعامل سبب للخير وحسن المعاشرة.','آل عمران 159']];document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-card"><span>🌱</span><b>'+x[0]+'</b><small>'+x[1]+'<br>📌 '+x[2]+'</small></article>').join('');</script></body></html>
