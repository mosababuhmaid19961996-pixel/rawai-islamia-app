<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبر نفسك - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>اختبار إسلامي</small></span></a></header><main class="inside tools-page"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero tools-hero"><small>تعلم بطريقة ممتعة</small><h1>🧠 اختبر نفسك</h1><p>أسئلة مختارة في القرآن والسنة والسيرة والعبادات.</p></section><section class="tool-section"><div id="quiz"></div><div id="score" style="margin-top:15px;font-weight:800"></div></section></main><script src="script.js"></script><script>const qs=[['ما أول سورة في المصحف؟',['الفاتحة','البقرة','الإخلاص','الناس'],0],['كم عدد الصلوات المفروضة في اليوم والليلة؟',['3','4','5','6'],2],['ما الشهر الذي يصومه المسلمون فرضًا؟',['محرم','رمضان','شوال','رجب'],1],['إلى أي مدينة هاجر النبي ﷺ؟',['الطائف','المدينة المنورة','القدس','دمشق'],1],['كم عدد أركان الإسلام؟',['3','4','5','6'],2],['ما أطول سورة في القرآن؟',['يس','البقرة','الكهف','النساء'],1],['ما قبلة المسلمين؟',['المسجد الأقصى','الكعبة','مسجد قباء','المسجد النبوي'],1],['من أول الخلفاء الراشدين؟',['عمر','عثمان','أبو بكر','علي'],2],['كم عدد أشهر السنة الهجرية؟',['10','11','12','13'],2],['ما اسم أم المؤمنين زوج النبي ﷺ ابنة أبي بكر؟',['حفصة','عائشة','خديجة','زينب'],1]];let i=0,score=0;function render(){if(i>=qs.length){document.getElementById('quiz').innerHTML='<h2>أحسنت! 🎉</h2><p>نتيجتك '+score+' من '+qs.length+'</p><button class="primary" onclick="location.reload()">إعادة الاختبار</button>';return}let q=qs[i];document.getElementById('quiz').innerHTML='<small>السؤال '+(i+1)+' من '+qs.length+'</small><h2>'+q[0]+'</h2>'+q[1].map((a,n)=>'<button class="tool-mini" style="display:block;width:100%;margin:8px 0;text-align:right" onclick="answer('+n+')">'+a+'</button>').join('');document.getElementById('score').textContent='النقاط: '+score}function answer(n){if(n===qs[i][2])score++;i++;render()}render();</script></body></html>
