<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحج والعمرة</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الحج والعمرة</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🕋 الحج والعمرة خطوة بخطوة</h1><p>دليل تعليمي مختصر للمناسك، ويُرجع في تفاصيل الحالات الخاصة إلى أهل العلم.</p></section><div id="list"></div></main><script src="script.js"></script><script>const a=[['الإحرام','النية والدخول في النسك من الميقات، مع الالتزام بمحظورات الإحرام.'],['الطواف','الطواف حول الكعبة سبعة أشواط، ويُراعى فيه ما ثبت من السنة.'],['السعي','السعي بين الصفا والمروة سبعة أشواط.'],['منى وعرفة','الوقوف بعرفة ركن عظيم من أركان الحج، ثم المبيت بمزدلفة بحسب النسك.'],['رمي الجمرات','رمي الجمرات في الأيام المحددة من أعمال الحج.'],['الحلق أو التقصير','يحلق الحاج أو يقصر، وبذلك يتحلل بحسب ترتيب النسك.'],['طواف الإفاضة','من أعمال الحج الأساسية، وله وقته وأحكامه.'],['طواف الوداع','يكون عند مغادرة مكة لغير الحائض والنفساء، مع تفاصيل معروفة في الفقه.']];document.getElementById('list').innerHTML=a.map((x,i)=>'<article class="tool-section"><h2>'+(i+1)+'. '+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');</script></body></html>
