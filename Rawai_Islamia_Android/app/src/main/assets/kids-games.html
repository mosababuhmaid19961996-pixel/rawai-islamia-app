<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب إسلامية للأطفال</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>ألعاب إسلامية للأطفال</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🧩 ألعاب إسلامية للأطفال</h1><p>ألعاب بسيطة تعليمية تعمل داخل التطبيق.</p></section><div class="tool-section"><h2>🎯 اختبر معلوماتك</h2><p id="q"></p><div id="opts"></div><b id="score">النقاط: 0</b></div></main><script src="script.js"></script><script>const qs=[['كم عدد الصلوات المفروضة؟',['3','5','7'],1],['ما أول سورة في المصحف؟',['الفاتحة','البقرة','الناس'],0],['في أي شهر يصوم المسلمون؟',['محرم','رمضان','شوال'],1],['كم عدد أركان الإسلام؟',['3','5','7'],1],['إلى أي مدينة هاجر النبي ﷺ؟',['المدينة المنورة','الطائف','القدس'],0]];let i=0,s=0;function show(){q.textContent=qs[i][0];opts.innerHTML=qs[i][1].map((x,j)=>'<button class="primary" onclick="ans('+j+')">'+x+'</button>').join(' ')}function ans(j){if(j===qs[i][2])s++;score.textContent='النقاط: '+s;i=(i+1)%qs.length;show()}show();</script></body></html>
