<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عالم الأطفال</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>عالم الأطفال</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🧒 عالم الأطفال</h1><p>تعلم مبسط للصغار بالأسئلة والأنشطة والقصص.</p></section><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['من خلقنا؟','الله سبحانه وتعالى خلقنا وخلق كل شيء.'],['ما كتاب المسلمين؟','القرآن الكريم.'],['من نبينا؟','محمد ﷺ.'],['ما أول أركان الإسلام؟','الشهادتان.'],['كم صلاة في اليوم؟','خمس صلوات مفروضة.'],['ماذا نقول قبل الطعام؟','نذكر اسم الله، ونأكل باليمين ونحمد الله بعد الطعام.'],['كيف نبر الوالدين؟','بالكلام الطيب والطاعة في المعروف والإحسان إليهما.'],['لعبة الصح والخطأ','الصلاة خمس مرات في اليوم: صح.'],['نشاط','اختر ذكرًا قصيرًا واحفظه وردده مع والديك.']];document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-card"><span>🧒</span><b>'+x[0]+'</b><small>'+x[1]+'</small></article>').join('');</script></body></html>
