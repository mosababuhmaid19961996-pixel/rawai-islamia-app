<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الغزوات والمعارك</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الغزوات والمعارك</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>⚔️ الغزوات والمعارك</h1><p>معلومات تاريخية مختصرة مع التنبيه إلى اختلاف بعض الروايات في التواريخ والأعداد.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث عن معركة"><div id="list"></div></main><script src="script.js"></script><script>const a=[['بدر الكبرى','2 هـ','من أشهر معارك السيرة، وورد ذكرها وأحداثها في القرآن، وانتهت بنصر المسلمين.','الأنفال 5-19'],['أحد','3 هـ','وقعت عند جبل أحد، وكان فيها ابتلاء شديد للمسلمين واستشهد حمزة رضي الله عنه.','آل عمران 121-179'],['الخندق / الأحزاب','5 هـ','تحالف عدد من القبائل وحاصروا المدينة، وثبت المسلمون حتى صرف الله الأحزاب.','الأحزاب 9-27'],['خيبر','7 هـ','خرج النبي ﷺ إلى خيبر، وانتهت الحملة بفتح حصونها وفق الروايات المشهورة.','البخاري ومسلم وأمهات كتب السيرة'],['فتح مكة','8 هـ','دخل النبي ﷺ مكة بعد نقض قريش وحلفائها العهد، وكان الفتح نقطة تحول كبرى.','التوبة 25-27، والسيرة'],['حنين','8 هـ','وقع القتال بعد فتح مكة، وذكّر القرآن بأن الكثرة وحدها لا تضمن النصر.','التوبة 25-27'],['تبوك','9 هـ','خرج النبي ﷺ في جيش العسرة شمالًا، ولم تقع معركة مباشرة مع جيش بيزنطي بحسب الرواية المشهورة.','التوبة 38-92']];function r(){let q=document.getElementById('q').value;list.innerHTML=a.filter(x=>x.join(' ').includes(q)).map(x=>'<article class="tool-section"><h2>'+x[0]+' — '+x[1]+'</h2><p>'+x[2]+'</p><small>📌 '+x[3]+'</small></article>').join('')}q.oninput=r;r();</script></body></html>
