<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الموسوعة الفقهية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الموسوعة الفقهية</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>⚖️ الموسوعة الفقهية</h1><p>أسئلة وأجوبة مرتبة للتعلم، مع التنبيه أن الفتوى الخاصة بالحالات الشخصية تُرجع لأهل العلم.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث في المسائل"><div id="items"></div></main><script src="script.js"></script><script>const data=[['الطهارة','ما فرائض الوضوء؟','غسل الوجه، وغسل اليدين إلى المرفقين، ومسح الرأس، وغسل الرجلين إلى الكعبين، مع النية.'],['الصلاة','ما أوقات الصلوات الخمس؟','الفجر، والظهر، والعصر، والمغرب، والعشاء، ولكل صلاة وقت محدد شرعًا.'],['الصلاة','ما حكم المحافظة على الصلاة؟','الصلاة من أعظم أركان الإسلام بعد الشهادتين، والمحافظة عليها من أهم الواجبات.'],['الصيام','متى يجب صيام رمضان؟','يجب صيام رمضان على المسلم البالغ العاقل القادر المقيم، مع تحقق دخول الشهر.'],['الزكاة','ما الزكاة؟','حق واجب في أموال مخصوصة، بشروطه وأنصبته وحوله، ويُرجع في التفصيل إلى أهل العلم.'],['الحج','متى يجب الحج؟','يجب مرة في العمر على المسلم المستطيع، قال تعالى: ولله على الناس حج البيت من استطاع إليه سبيلًا.'],['الأسرة','ما حق الوالدين؟','الإحسان إليهما وبرهما وصحبتهما بالمعروف، مع عدم طاعة المخلوق في معصية الخالق.'],['المعاملات','ما الأصل في البيع؟','الأصل في المعاملات الإباحة ما لم يشتمل العقد على محرم أو ظلم أو غرر ونحو ذلك.']];function r(){let q=document.getElementById('q').value.trim();document.getElementById('items').innerHTML=data.filter(x=>!q||x.join(' ').includes(q)).map(x=>'<article class="tool-section"><span>'+x[0]+'</span><h2>'+x[1]+'</h2><p>'+x[2]+'</p></article>').join('')}document.getElementById('q').oninput=r;r();</script></body></html>
