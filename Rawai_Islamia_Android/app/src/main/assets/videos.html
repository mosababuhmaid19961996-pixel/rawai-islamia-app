<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفيديوهات الدينية - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الفيديوهات الدينية</small></a></header><main class="inside tools-page"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero tools-hero"><small>مكتبة فيديو</small><h1>🎥 الفيديوهات الدينية</h1><p>آلاف النتائج الدينية من البحث المباشر عبر YouTube، مع فتح الفيديو من مصدره الأصلي.</p></section><section class="tool-section"><input id="search" class="video-search" placeholder="🔎 ابحث عن درس أو قرآن أو سيرة..."><div class="video-filters" id="filters"></div><div id="status"></div><div class="video-grid" id="videos"></div></section></main><script src="script.js"></script><script>
const sources=[['القرآن والتلاوات','قرآن كريم تلاوة'],['التفسير','تفسير القرآن دروس'],['السيرة النبوية','السيرة النبوية دروس'],['الخطب والدروس','محاضرات إسلامية'],['الأذكار والأدعية','أذكار وأدعية'],['الأطفال','قصص إسلامية للأطفال']];
let cat='',q='';
function url(s){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(s)}
function render(){const query=q||sources.find(x=>x[0]===cat)?.[1]||'فيديوهات دينية إسلامية';document.getElementById('videos').innerHTML='<article class="video-card"><div class="video-thumb">▶</div><div class="video-body"><span>مصدر مباشر</span><h3>نتائج '+(cat||'الفيديوهات الدينية')+'</h3><a class="primary" target="_blank" rel="noopener" href="'+url(query)+'">مشاهدة آلاف النتائج ↗</a></div></article>';document.getElementById('status').textContent='المكتبة تعتمد على نتائج الفيديو المباشرة من المصدر، ويمكنك البحث والتصفية حسب القسم.'}
document.getElementById('search').oninput=e=>{q=e.target.value;render()};
document.getElementById('filters').innerHTML='<button class="tool-mini active" data-c="">الكل</button>'+sources.map(s=>'<button class="tool-mini" data-c="'+s[0]+'">'+s[0]+'</button>').join('');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;q='';document.getElementById('search').value='';document.querySelectorAll('[data-c]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render();
</script></body></html>
