<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قصص الصالحين</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>قصص الصالحين</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🌿 قصص الصالحين</h1><p>قصص ثابتة من القرآن والسنة، بعيدًا عن القصص الشعبية غير الموثقة.</p></section><div id="list"></div></main><script src="script.js"></script><script>const a=[['أصحاب الكهف','فتية آمنوا بربهم وفرّوا بدينهم، وذكر القرآن قصتهم في سورة الكهف.','الكهف 9-26'],['مريم عليها السلام','مثال للعفة والعبادة والصبر، ووردت قصتها بتفصيل في القرآن.','مريم 16-36'],['مؤمن آل فرعون','رجل كتم إيمانه ودافع عن موسى عليه السلام بالحجة والنصح.','غافر 28-45'],['أصحاب الأخدود','قصة المؤمنين الذين ثبتوا على الإيمان أمام التعذيب، وورد ذكرهم في سورة البروج.','البروج 4-10'],['الرجل الذي سقى الكلب','قصة رجل غفر الله له بسبب رحمته بالحيوان، وهي ثابتة في الصحيحين.','البخاري ومسلم'],['أصحاب الغار','ثلاثة آواهم الغار، فتوسل كل واحد إلى الله بعمل صالح فعله.','البخاري ومسلم']];list.innerHTML=a.map(x=>'<article class="tool-section"><h2>🌿 '+x[0]+'</h2><p>'+x[1]+'</p><small>📖 '+x[2]+'</small></article>').join('');</script></body></html>
