<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأسرة والتربية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الأسرة والتربية</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>👨‍👩‍👧 الأسرة والتربية</h1><p>مبادئ عملية لبناء أسرة قائمة على الرحمة والمسؤولية وحسن التربية.</p></section><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['الرحمة','التعامل داخل الأسرة بالرحمة والرفق وحسن الكلام.'],['الصلاة','تعويد الأبناء على الصلاة والتعليم بالقدوة والصبر.'],['الحوار','الاستماع للطفل واحترام سؤاله وتصحيح الخطأ بهدوء.'],['القدوة','الأبوان قدوة عملية؛ السلوك اليومي أبلغ من الكلام وحده.'],['صلة الرحم','تعليم الأبناء بر الأقارب وصلة الرحم والإحسان.'],['الأمان الرقمي','تعليم الأبناء الاستخدام الآمن والمسؤول للإنترنت مع المتابعة والحوار.'],['حل الخلافات','العدل، الإصغاء، تجنب الإهانة، والبحث عن حل يرضي الأطراف في المعروف.']];document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-card"><span>👨‍👩‍👧</span><b>'+x[0]+'</b><small>'+x[1]+'</small></article>').join('');</script></body></html>
