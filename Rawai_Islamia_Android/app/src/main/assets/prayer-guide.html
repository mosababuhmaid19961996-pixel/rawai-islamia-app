<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعليم الصلاة</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>تعليم الصلاة</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🕌 تعليم الصلاة خطوة بخطوة</h1><p>دليل تعليمي مرتب للصلاة، مبني على الأحاديث الواردة في صفة الصلاة.</p></section><div id="list"></div></main><script src="script.js"></script><script>const a=[['قبل الصلاة','الطهارة، ستر العورة، دخول الوقت، استقبال القبلة، والنية.'],['تكبيرة الإحرام','يقوم المصلي ويكبر، ثم يقرأ ما تيسر من القرآن.'],['الركوع','يكبر ويركع مطمئنًا، ثم يرفع حتى يستوي قائمًا.'],['السجود','يسجد مطمئنًا، ثم يجلس بين السجدتين، ثم يسجد مرة ثانية.'],['الركعة التالية','يقوم للركعة التالية ويفعل مثل ذلك بحسب عدد ركعات الصلاة.'],['التشهد','يجلس للتشهد، وفي آخر الصلاة يقرأ التشهد والصلاة الإبراهيمية بحسب السنة.'],['السلام','يختم الصلاة بالتسليم.']];document.getElementById('list').innerHTML=a.map((x,i)=>'<article class="tool-section"><h2>'+(i+1)+'. '+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');</script></body></html>
