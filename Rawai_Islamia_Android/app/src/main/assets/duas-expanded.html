<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأدعية الموسعة</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الأدعية الموسعة</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📿 الأدعية الموسعة</h1><p>مجموعة منتقاة من الأدعية الثابتة أو الواردة في المصادر، مع تصنيفها لتسهيل الوصول إليها.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث في الأدعية"><div id="list"></div></main><script src="script.js"></script><script>const a=[['خير الدنيا والآخرة','اللهم آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.','متفق عليه'],['الهداية والتقوى','اللهم إني أسألك الهدى والتقى والعفاف والغنى.','رواه مسلم'],['المغفرة والرحمة','اللهم اغفر لي وارحمني واهدني وعافني وارزقني.','رواه مسلم'],['الهداية والسداد','اللهم اهدني وسددني.','رواه مسلم'],['الاستعاذة من شر الحواس','اللهم إني أعوذ بك من شر سمعي ومن شر بصري ومن شر لساني ومن شر قلبي ومن شر مني.','أبو داود والترمذي'],['الحلال والكفاية','اللهم اكفني بحلالك عن حرامك وأغنني بفضلك عمن سواك.','الترمذي، وحسنه'],['الاستعانة','اللهم إني أعوذ بك من الهم والحزن والعجز والكسل والجبن والبخل وضلع الدين وغلبة الرجال.','البخاري'],['دعاء شامل','اللهم إني أسألك من خير ما سألك منه نبيك محمد ﷺ وأعوذ بك من شر ما استعاذ منه نبيك محمد ﷺ.','الترمذي/رياض الصالحين']];function r(){let q=document.getElementById('q').value;list.innerHTML=a.filter(x=>x.join(' ').includes(q)).map(x=>'<article class="tool-section"><h2>'+x[0]+'</h2><p>'+x[1]+'</p><small>📚 '+x[2]+'</small></article>').join('')}q.oninput=r;r();</script></body></html>
