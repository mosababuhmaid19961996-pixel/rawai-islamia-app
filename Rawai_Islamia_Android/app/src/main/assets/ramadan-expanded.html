<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رمضان والصيام</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>رمضان والصيام</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🌙 رمضان والصيام</h1><p>دليل مختصر لأهم أعمال الشهر وأحكام الصيام الأساسية.</p></section><div id="list"></div></main><script src="script.js"></script><script>const a=[['نية الصيام','الصيام عبادة، ويجب استحضار النية وفق نوع الصيام وحكمه.'],['السحور','السحور سنة وفيه بركة.'],['الإفطار','يُستحب تعجيل الفطر عند تحقق غروب الشمس، مع الدعاء المشروع.'],['المفطرات','الأكل والشرب عمدًا من أشهر المفطرات، وتفاصيل بقية المفطرات فيها أحكام تحتاج إلى تفصيل فقهي.'],['قيام رمضان','قيام رمضان من القربات العظيمة، ويُشرع للمسلم أن يصلي بحسب قدرته.'],['ليلة القدر','تُتحرى في العشر الأواخر، ويكثر المسلم فيها من الدعاء والقيام والقرآن.'],['زكاة الفطر','تجب زكاة الفطر على من تلزمه وفق أحكامها، ويُراعى وقت إخراجها ومقدارها بحسب فتوى البلد.']];list.innerHTML=a.map(x=>'<article class="tool-section"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');</script></body></html>
