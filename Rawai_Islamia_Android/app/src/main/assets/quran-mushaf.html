<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف الكريم</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>المصحف والبحث</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📖 المصحف الكريم</h1><p>قراءة المصحف داخل التطبيق، وتظهر السورة كاملة في صفحة واحدة دون مقاطع صوتية.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث عن سورة أو آية أو رقم"><div id="list"></div></main><script src="script.js"></script><script>
let data=[];
async function load(){const r=await fetch('https://api.alquran.cloud/v1/surah');const j=await r.json();data=j.data||[];render()}
async function openSurah(n){const box=document.getElementById('list');box.innerHTML='<p>جارٍ تحميل السورة...</p>';try{const t=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani').then(x=>x.json());const verses=t.data.ayahs||[];box.innerHTML='<button class="primary" onclick="render()">← السور</button><article class="tool-section quran-page"><h2>'+t.data.number+'. '+t.data.name+'</h2><p>'+t.data.numberOfAyahs+' آية</p><div class="quran-text">'+verses.map(v=>v.text+' ﴿'+v.numberInSurah+'﴾').join(' ')+'</div></article>'}catch(e){box.innerHTML='<p>تعذر تحميل السورة الآن.</p>'}}
function render(){const q=document.getElementById('q').value.trim();const a=data.filter(x=>!q||x.name.includes(q)||x.englishName.toLowerCase().includes(q.toLowerCase())||String(x.number)===q);document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-section"><h2>'+x.number+'. '+x.name+'</h2><p>'+x.numberOfAyahs+' آية • '+(x.revelationType==='Meccan'?'مكية':'مدنية')+'</p><button class="primary" onclick="openSurah('+x.number+')">قراءة المصحف</button></article>').join('')}
document.getElementById('q').oninput=render;load().catch(()=>document.getElementById('list').innerHTML='<p>تعذر الاتصال بالمصدر حاليًا.</p>');
</script>></body></html>
