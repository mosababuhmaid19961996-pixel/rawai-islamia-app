<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف الكريم</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>المصحف الكريم</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📖 المصحف الكريم</h1><p>مصحف إلكتروني بصفحات كبيرة وواضحة، مع تقليب الصفحات بسهولة.</p></section><div class="quran-controls"><input id="q" class="video-search" placeholder="🔎 ابحث باسم السورة أو رقمها"><select id="surahJump" class="video-search"><option value="">📖 الانتقال إلى سورة...</option></select></div><div id="status" class="tool-section"><p>جارٍ تحميل المصحف الكريم...</p></div><div class="page-tools"><button id="prevPage" class="primary">→ الصفحة السابقة</button><span id="pageInfo">صفحة 1</span><button id="nextPage" class="primary">الصفحة التالية ←</button></div><div id="mushaf" class="mushaf-page"></div></main><script>
const TOTAL_PAGES=604;let currentPage=1,loading=false;
async function load(){buildJump();await showPage(1)}
function buildJump(){const s=document.getElementById('surahJump');s.innerHTML='<option value="">📖 الانتقال إلى سورة...</option>'+Array.from({length:114},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'. سورة '+['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'][i]+'</option>').join('');s.onchange=()=>{const n=Number(s.value);if(n)jumpToSurah(n)}}
async function jumpToSurah(n){document.getElementById('status').style.display='block';document.getElementById('status').innerHTML='<p>جارٍ الانتقال إلى السورة...</p>';try{const r=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani');const j=await r.json();const ay=j.data?.ayahs?.[0];if(ay?.page)await showPage(ay.page)}catch(e){document.getElementById('status').innerHTML='<p>تعذر الانتقال للسورة الآن.</p>'}finally{document.getElementById('surahJump').value=''}}
async function showPage(n){if(loading)return;currentPage=Math.max(1,Math.min(TOTAL_PAGES,n));loading=true;document.getElementById('status').style.display='block';document.getElementById('status').innerHTML='<p>جارٍ تحميل الصفحة '+currentPage+'...</p>';try{const r=await fetch('https://api.alquran.cloud/v1/page/'+currentPage+'/quran-uthmani');const j=await r.json();const d=j.data;if(!d?.ayahs?.length)throw new Error('empty');const first=d.ayahs[0],last=d.ayahs[d.ayahs.length-1];const surahName=first.surah?.name||'القرآن الكريم';document.getElementById('mushaf').innerHTML='<article class="paper-page"><div class="paper-frame"><div class="surah-title"><span>'+surahName+'</span><h2>الصفحة '+currentPage+'</h2><small>'+first.surah?.number+' • '+(first.surah?.revelationType==='Meccan'?'مكية':'مدنية')+'</small></div><div class="quran-text">'+d.ayahs.map(v=>v.text+' ﴿'+v.numberInSurah+'﴾').join(' ')+'</div><div class="page-number">'+currentPage+'</div></div></article>';document.getElementById('status').style.display='none';document.getElementById('pageInfo').textContent='صفحة '+currentPage+' من '+TOTAL_PAGES;document.getElementById('prevPage').disabled=currentPage===1;document.getElementById('nextPage').disabled=currentPage===TOTAL_PAGES;window.scrollTo({top:0,behavior:'smooth'})}catch(e){document.getElementById('status').innerHTML='<p>تعذر تحميل هذه الصفحة. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.</p>'}finally{loading=false}}
document.getElementById('prevPage').onclick=()=>showPage(currentPage-1);document.getElementById('nextPage').onclick=()=>showPage(currentPage+1);
let touchStartX=0,touchStartY=0;document.getElementById('mushaf').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});document.getElementById('mushaf').addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx>0)showPage(currentPage+1);else showPage(currentPage-1)}},{passive:true});
document.getElementById('q').oninput=async()=>{const q=document.getElementById('q').value.trim();if(!q)return;const n=Number(q);if(n>=1&&n<=604){await showPage(n);return}try{const r=await fetch('https://api.alquran.cloud/v1/search/'+encodeURIComponent(q)+'/all/quran-uthmani');const j=await r.json();const ay=j.data?.matches?.[0];if(ay?.page)showPage(ay.page)}catch(e){}};
load();
</script><style>.quran-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.quran-controls .video-search{width:100%;box-sizing:border-box}.mushaf-page{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}.mushaf-surah{padding:24px 18px;border-bottom:1px solid var(--line);scroll-margin-top:20px}.mushaf-surah:last-child{border-bottom:0}.mushaf-surah-head{text-align:center;margin-bottom:18px;padding:12px;border-radius:16px;background:rgba(237,246,243,.7)}.mushaf-surah-head span{display:block;font-size:11px;color:var(--green);font-weight:800}.mushaf-surah-head h2{margin:3px 0 4px;font-size:24px}.mushaf-surah-head small{color:var(--muted);font-size:11px}.mushaf-surah .quran-text{font-family:serif;font-size:25px;line-height:2.25;text-align:justify;direction:rtl}.dark .mushaf-surah-head{background:rgba(23,59,53,.55)}@media(max-width:600px){.quran-controls{grid-template-columns:1fr}.mushaf-surah{padding:18px 12px}.mushaf-surah .quran-text{font-size:22px;line-height:2.15}}.page-tools{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}.page-tools button{font-size:13px}.page-tools button:disabled{opacity:.45;cursor:not-allowed}.page-tools span{font-weight:800;min-width:90px;text-align:center}.mushaf-page{background:transparent;border:0;overflow:visible}.mushaf-page{touch-action:pan-y}.paper-page{background:#f8f1df;border:1px solid #c9b98f;border-radius:8px;padding:10px;box-shadow:0 8px 25px rgba(0,0,0,.12)}.paper-frame{position:relative;border:3px double #b79b5b;border-radius:5px;padding:28px 20px 48px;min-height:68vh;background:#fffdf6}.surah-title{text-align:center;margin-bottom:22px;padding:10px 8px;border-bottom:1px solid #d6c69f}.surah-title span{display:block;font-size:13px}.surah-title h2{margin:3px 0;font-size:28px}.surah-title small{font-size:12px}.paper-frame .quran-text{font-family:serif;font-size:30px;line-height:2.25;text-align:justify;direction:rtl;color:#17140d}.page-number{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-weight:800;font-size:14px}.dark .paper-page{background:#d9cfb5}.dark .paper-frame{background:#25231e;border-color:#9f8954}.dark .paper-frame .quran-text,.dark .surah-title{color:#f4ecd9}.dark .surah-title{border-color:#665a40}@media(max-width:600px){.page-tools{gap:6px}.page-tools button{padding:9px 8px;font-size:11px}.paper-page{padding:6px}.paper-frame{padding:22px 12px 44px;min-height:70vh}.surah-title h2{font-size:25px}.paper-frame .quran-text{font-size:25px;line-height:2.2;text-align:justify}}</style></body></html>
