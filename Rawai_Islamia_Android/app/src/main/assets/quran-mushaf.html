<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف والبحث في القرآن</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>المصحف والبحث</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📖 المصحف والبحث في القرآن</h1><p>ابحث في نصوص القرآن من خلال مصدر القرآن المفتوح، واختر السورة لقراءة آياتها.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث عن سورة أو آية"><div id="list"></div></main><script src="script.js"></script><script>
const api='https://api.alquran.cloud/v1/surah';let data=[];async function load(){const r=await fetch(api);const j=await r.json();data=j.data||[];render()}function render(){const q=document.getElementById('q').value.trim();const a=data.filter(x=>!q||x.name.includes(q)||x.englishName.toLowerCase().includes(q.toLowerCase())||String(x.number)===q);document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-section"><h2>'+x.number+'. '+x.name+'</h2><p>'+x.numberOfAyahs+' آية • '+(x.revelationType==='Meccan'?'مكية':'مدنية')+'</p><a class="primary" target="_blank" rel="noopener" href="https://quran.com/'+x.number+'">فتح السورة وقراءة الآيات ↗</a></article>').join('')}document.getElementById('q').oninput=render;load().catch(()=>document.getElementById('list').innerHTML='<p>تعذر الاتصال بالمصدر حاليًا.</p>');</script></body></html>
