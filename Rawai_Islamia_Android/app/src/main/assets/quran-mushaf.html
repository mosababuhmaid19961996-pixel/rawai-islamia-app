<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف الكريم</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>المصحف الكريم</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📖 المصحف الكريم</h1><p>مصحف إلكتروني بصفحات كبيرة وواضحة، مع تقليب الصفحات بسهولة.</p></section><div class="quran-controls"><input id="q" class="video-search" placeholder="🔎 ابحث باسم السورة أو رقمها"><select id="surahJump" class="video-search"><option value="">📖 الانتقال إلى سورة...</option></select></div><div id="status" class="tool-section"><p>جارٍ تحميل المصحف الكريم...</p></div><div class="page-tools"><button id="prevPage" class="primary">→ الصفحة السابقة</button><span id="pageInfo">صفحة 1</span><button id="nextPage" class="primary">الصفحة التالية ←</button></div><div id="mushaf" class="mushaf-page"></div></main><script>
let data=[],pages=[],currentPage=0;
async function load(){try{const r=await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');const j=await r.json();data=j.data?.surahs||[];if(!data.length)throw new Error('empty');buildJump();buildPages();showPage(0);document.getElementById('status').style.display='none'}catch(e){document.getElementById('status').innerHTML='<p>تعذر تحميل المصحف الآن. تحقق من اتصال الإنترنت ثم أعد المحاولة.</p>'}}
function buildJump(){const s=document.getElementById('surahJump');s.innerHTML='<option value="">📖 الانتقال إلى سورة...</option>'+data.map(x=>'<option value="'+x.number+'">'+x.number+'. '+x.name+'</option>').join('');s.onchange=()=>{const n=Number(s.value);if(!n)return;const i=pages.findIndex(p=>p.surah===n);if(i>=0)showPage(i);s.value=''}}
function buildPages(){pages=[];data.forEach(x=>{const verses=x.ayahs||[],size=8;for(let i=0;i<verses.length;i+=size)pages.push({surah:x.number,name:x.name,total:x.numberOfAyahs,type:x.revelationType,part:Math.floor(i/size)+1,parts:Math.ceil(verses.length/size),ayahs:verses.slice(i,i+size)})})}
function showPage(i){if(!pages.length)return;currentPage=Math.max(0,Math.min(i,pages.length-1));const p=pages[currentPage];document.getElementById('mushaf').innerHTML='<article class="paper-page"><div class="paper-frame"><div class="surah-title"><span>سورة</span><h2>'+p.name+'</h2><small>'+p.total+' آية • '+(p.type==='Meccan'?'مكية':'مدنية')+'</small></div><div class="quran-text">'+p.ayahs.map(v=>v.text+' ﴿'+v.numberInSurah+'﴾').join(' ')+'</div><div class="page-number">'+(currentPage+1)+'</div></div></article>';document.getElementById('pageInfo').textContent='صفحة '+(currentPage+1)+' من '+pages.length;document.getElementById('prevPage').disabled=currentPage===0;document.getElementById('nextPage').disabled=currentPage===pages.length-1;window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('prevPage').onclick=()=>showPage(currentPage-1);document.getElementById('nextPage').onclick=()=>showPage(currentPage+1);\nlet touchStartX=0,touchStartY=0;document.getElementById('mushaf').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});document.getElementById('mushaf').addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx<0)showPage(currentPage+1);else showPage(currentPage-1)}},{passive:true});
document.getElementById('q').oninput=()=>{const q=document.getElementById('q').value.trim();if(!q){showPage(0);return}const i=pages.findIndex(p=>p.name.includes(q)||String(p.surah)===q||p.ayahs.some(v=>v.text.includes(q)));if(i>=0)showPage(i)};
load();
</script><style>.quran-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.quran-controls .video-search{width:100%;box-sizing:border-box}.mushaf-page{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}.mushaf-surah{padding:24px 18px;border-bottom:1px solid var(--line);scroll-margin-top:20px}.mushaf-surah:last-child{border-bottom:0}.mushaf-surah-head{text-align:center;margin-bottom:18px;padding:12px;border-radius:16px;background:rgba(237,246,243,.7)}.mushaf-surah-head span{display:block;font-size:11px;color:var(--green);font-weight:800}.mushaf-surah-head h2{margin:3px 0 4px;font-size:24px}.mushaf-surah-head small{color:var(--muted);font-size:11px}.mushaf-surah .quran-text{font-family:serif;font-size:25px;line-height:2.25;text-align:justify;direction:rtl}.dark .mushaf-surah-head{background:rgba(23,59,53,.55)}@media(max-width:600px){.quran-controls{grid-template-columns:1fr}.mushaf-surah{padding:18px 12px}.mushaf-surah .quran-text{font-size:22px;line-height:2.15}}.page-tools{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}.page-tools button{font-size:13px}.page-tools button:disabled{opacity:.45;cursor:not-allowed}.page-tools span{font-weight:800;min-width:90px;text-align:center}.mushaf-page{background:transparent;border:0;overflow:visible}.mushaf-page{touch-action:pan-y}.paper-page{background:#f8f1df;border:1px solid #c9b98f;border-radius:8px;padding:10px;box-shadow:0 8px 25px rgba(0,0,0,.12)}.paper-frame{position:relative;border:3px double #b79b5b;border-radius:5px;padding:28px 20px 48px;min-height:68vh;background:#fffdf6}.surah-title{text-align:center;margin-bottom:22px;padding:10px 8px;border-bottom:1px solid #d6c69f}.surah-title span{display:block;font-size:13px}.surah-title h2{margin:3px 0;font-size:28px}.surah-title small{font-size:12px}.paper-frame .quran-text{font-family:serif;font-size:30px;line-height:2.25;text-align:justify;direction:rtl;color:#17140d}.page-number{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-weight:800;font-size:14px}.dark .paper-page{background:#d9cfb5}.dark .paper-frame{background:#25231e;border-color:#9f8954}.dark .paper-frame .quran-text,.dark .surah-title{color:#f4ecd9}.dark .surah-title{border-color:#665a40}@media(max-width:600px){.page-tools{gap:6px}.page-tools button{padding:9px 8px;font-size:11px}.paper-page{padding:6px}.paper-frame{padding:22px 12px 44px;min-height:70vh}.surah-title h2{font-size:25px}.paper-frame .quran-text{font-size:25px;line-height:2.2;text-align:justify}}</style></body></html>
