<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصحف الكريم</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>المصحف الكريم</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📖 المصحف الكريم</h1><p>المصحف كاملًا في صفحة واحدة، تقرأ السور متتابعة دون الحاجة لفتح كل سورة على حدة.</p></section><div class="quran-controls"><input id="q" class="video-search" placeholder="🔎 ابحث باسم السورة أو رقمها"><select id="surahJump" class="video-search"><option value="">📖 الانتقال إلى سورة...</option></select></div><div id="status" class="tool-section"><p>جارٍ تحميل المصحف الكريم...</p></div><div id="mushaf" class="mushaf-page"></div></main><script>
let data=[];
async function load(){try{const r=await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');const j=await r.json();data=j.data?.surahs||[];if(!data.length)throw new Error('empty');buildJump();render(data);document.getElementById('status').style.display='none'}catch(e){document.getElementById('status').innerHTML='<p>تعذر تحميل المصحف الآن. تحقق من اتصال الإنترنت ثم أعد المحاولة.</p>'}}
function buildJump(){const s=document.getElementById('surahJump');s.innerHTML='<option value="">📖 الانتقال إلى سورة...</option>'+data.map(x=>'<option value="surah-'+x.number+'">'+x.number+'. '+x.name+'</option>').join('');s.onchange=()=>{if(!s.value)return;const el=document.getElementById(s.value);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});s.value=''}}
function render(list){const q=document.getElementById('q').value.trim();const filtered=list.filter(x=>!q||x.name.includes(q)||String(x.number)===q);document.getElementById('mushaf').innerHTML=filtered.map(x=>'<article class="mushaf-surah" id="surah-'+x.number+'"><div class="mushaf-surah-head"><span>سورة</span><h2>'+x.name+'</h2><small>'+x.numberOfAyahs+' آية • '+(x.revelationType==='Meccan'?'مكية':'مدنية')+'</small></div><div class="quran-text">'+x.ayahs.map(v=>v.text+' ﴿'+v.numberInSurah+'﴾').join(' ')+'</div></article>').join('')||'<div class="tool-section"><p>لا توجد سورة مطابقة للبحث.</p></div>'}
document.getElementById('q').oninput=()=>render(data);load();
</script><style>.quran-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.quran-controls .video-search{width:100%;box-sizing:border-box}.mushaf-page{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}.mushaf-surah{padding:24px 18px;border-bottom:1px solid var(--line);scroll-margin-top:20px}.mushaf-surah:last-child{border-bottom:0}.mushaf-surah-head{text-align:center;margin-bottom:18px;padding:12px;border-radius:16px;background:rgba(237,246,243,.7)}.mushaf-surah-head span{display:block;font-size:11px;color:var(--green);font-weight:800}.mushaf-surah-head h2{margin:3px 0 4px;font-size:24px}.mushaf-surah-head small{color:var(--muted);font-size:11px}.mushaf-surah .quran-text{font-family:serif;font-size:25px;line-height:2.25;text-align:justify;direction:rtl}.dark .mushaf-surah-head{background:rgba(23,59,53,.55)}@media(max-width:600px){.quran-controls{grid-template-columns:1fr}.mushaf-surah{padding:18px 12px}.mushaf-surah .quran-text{font-size:22px;line-height:2.15}}</style></body></html>
