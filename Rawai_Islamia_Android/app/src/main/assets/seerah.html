<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السيرة النبوية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>السيرة النبوية</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🕌 السيرة النبوية</h1><p>خط زمني تعليمي لأبرز مراحل حياة النبي ﷺ.</p></section><div id="timeline" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['المولد والنشأة','ولد النبي ﷺ في مكة ونشأ يتيم الأب، ثم توفيت أمه وهو صغير.'],['بداية الوحي','نزل الوحي على النبي ﷺ في غار حراء، وبدأت الرسالة.'],['الدعوة في مكة','دعا إلى توحيد الله والصبر على الأذى، ثم اشتد أذى المشركين للمؤمنين.'],['الهجرة','هاجر النبي ﷺ وأصحابه من مكة إلى المدينة، وكانت الهجرة بداية مرحلة جديدة للدعوة.'],['المدينة','بُني المسجد، وآخى النبي ﷺ بين المهاجرين والأنصار، ونظمت شؤون المجتمع.'],['الحديبية','وقعت بيعة الرضوان وصلح الحديبية، وكان الصلح مرحلة مهمة في انتشار الدعوة.'],['فتح مكة','دخل النبي ﷺ مكة فاتحًا، وعفا عن كثير ممن آذوه، وهُدمت الأوثان حول الكعبة.'],['حجة الوداع','حج النبي ﷺ حجة الوداع، وعلّم الناس مناسكهم وبيّن حقوقهم.'],['الوفاة','توفي النبي ﷺ في المدينة بعد أن أدى الأمانة وبلّغ الرسالة.']];document.getElementById('timeline').innerHTML=a.map(x=>'<article class="tool-card"><span>📜</span><b>'+x[0]+'</b><small>'+x[1]+'</small></article>').join('');</script></body></html>
