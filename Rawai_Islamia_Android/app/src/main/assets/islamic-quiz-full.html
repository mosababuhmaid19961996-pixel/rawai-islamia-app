<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبر نفسك</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>اختبر نفسك</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🧠 اختبر معلوماتك الإسلامية</h1><p>أسئلة تعليمية قصيرة.</p></section><div id="q"></div><button class="primary" onclick="next()">السؤال التالي</button></main><script src="script.js"></script><script>const a=[['كم عدد الصلوات المفروضة؟',['3','5','7'],'5'],['ما أول سورة في المصحف؟',['الفاتحة','البقرة','الناس'],'الفاتحة'],['في أي شهر يصوم المسلمون رمضان؟',['رمضان','شوال','محرم'],'رمضان'],['من خاتم الأنبياء؟',['موسى','محمد ﷺ','عيسى'],'محمد ﷺ'],['كم عدد أركان الإسلام؟',['3','5','7'],'5'],['ما قبلة المسلمين؟',['المسجد الأقصى','الكعبة','المدينة'],'الكعبة'],['ما كتاب المسلمين؟',['القرآن الكريم','الإنجيل','التوراة'],'القرآن الكريم'],['من أول الخلفاء الراشدين؟',['عمر','أبو بكر','عثمان'],'أبو بكر']];let i=0,score=0;function next(){if(i){let v=document.querySelector('input[name=x]:checked');if(v&&v.value===a[i-1][2])score++}if(i>=a.length){q.innerHTML='<h2>أحسنت! نتيجتك '+score+' / '+a.length+'</h2>';return}let x=a[i++];q.innerHTML='<article class="tool-section"><h2>'+i+'. '+x[0]+'</h2>'+x[1].map(v=>'<label style="display:block;padding:10px"><input type="radio" name="x" value="'+v+'"> '+v+'</label>').join('')+'</article>'}next();</script></body></html>
