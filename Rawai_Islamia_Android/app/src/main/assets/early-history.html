<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التاريخ الإسلامي</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>التاريخ الإسلامي</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🏛️ التاريخ الإسلامي</h1><p>خط زمني تعليمي يبدأ من عصر النبوة والخلافة الراشدة، مع التفريق بين المصادر الدينية والتاريخية.</p></section><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['عصر النبوة','بناء المجتمع الإسلامي في مكة والمدينة ونشر الرسالة.'],['الخلافة الراشدة','عصر أبي بكر وعمر وعثمان وعلي رضي الله عنهم، وما شهده من توسع وأحداث سياسية وعلمية.'],['الدولة الأموية','مرحلة تاريخية امتدت فيها الدولة الإسلامية جغرافيًا وتطورت فيها مؤسسات الحكم والإدارة.'],['الدولة العباسية','عصر طويل ازدهرت فيه علوم وثقافات ومراكز علمية، وشهد أيضًا تحولات سياسية كبيرة.'],['الأندلس','حضور إسلامي طويل في شبه الجزيرة الإيبيرية، نشأت خلاله مراكز علم وثقافة وفنون.'],['الدولة العثمانية','إمبراطورية إسلامية امتدت قرونًا وشملت مناطق واسعة، وكان لها أثر سياسي وثقافي كبير.']];document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-card"><span>🏛️</span><b>'+x[0]+'</b><small>'+x[1]+'</small></article>').join('');</script></body></html>
