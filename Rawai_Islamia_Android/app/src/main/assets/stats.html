<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إحصائياتي - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>إحصائياتي</small></span></a></header><main class="inside tools-page"><a class="back" href="more.html">← مركز الأدوات</a><section class="section-hero tools-hero"><small>تقدمك الشخصي</small><h1>📊 إحصائياتي</h1><p>الأرقام محفوظة على جهازك ولا تحتاج إلى حساب.</p></section><div class="tools-grid" id="stats"></div></main><script src="script.js"></script><script>function render(){const fav=JSON.parse(localStorage.getItem('rawai-favorites')||'[]').length,played=Number(localStorage.getItem('rawai-ach-played')||0),tas=Number(localStorage.getItem('rawai-ach-tasbih')||0),w=Number(localStorage.getItem('rawai-ach-wird')||0),k=Number(localStorage.getItem('rawai-khatma')||0);document.getElementById('stats').innerHTML=[['🎧','مرات الاستماع',played],['❤️','المفضلة',fav],['📿','التسبيح',tas],['📖','ورد اليوم',w+'/5'],['🕋','أجزاء الختمة',k+'/30']].map(x=>'<div class="tool-card"><span>'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')}render();</script></body></html>
