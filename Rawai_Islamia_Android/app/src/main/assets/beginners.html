<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإسلام للمبتدئين</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الإسلام للمبتدئين</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🌟 الإسلام للمبتدئين</h1><p>مسار بسيط يبدأ من الأساسيات ثم ينتقل تدريجيًا إلى العبادة والمعرفة.</p></section><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['التوحيد','معرفة أن العبادة لله وحده وأن الإسلام يقوم على توحيد الله واتباع رسوله ﷺ.'],['الشهادتان','شهادة أن لا إله إلا الله وأن محمدًا رسول الله.'],['أركان الإسلام','الشهادتان، الصلاة، الزكاة، الصوم، الحج لمن استطاع إليه سبيلًا.'],['أركان الإيمان','الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر.'],['الوضوء','تعلم الطهارة والوضوء ثم الصلاة خطوة بخطوة.'],['القرآن','ابدأ بالفاتحة والسور القصيرة، واقرأ بتدبر وتعلم المعاني.'],['الأخلاق','اجعل الصدق والأمانة والرحمة وحسن التعامل جزءًا من التعلم.']];document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-card"><span>🌟</span><b>'+x[0]+'</b><small>'+x[1]+'</small></article>').join('');</script></body></html>
