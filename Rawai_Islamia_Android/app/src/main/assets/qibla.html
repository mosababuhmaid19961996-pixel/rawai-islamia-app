<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوصلة القبلة - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>بوصلة القبلة</small></span></a></header><main class="inside tools-page"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero tools-hero"><small>اتجاه الصلاة</small><h1>🧭 بوصلة القبلة</h1><p>اختر مدينتك لمعرفة اتجاه القبلة التقريبي. لا نطلب موقعك الدقيق.</p></section><section class="tool-section"><select id="city" style="width:100%;padding:14px;border-radius:12px;border:1px solid #dfe8e4"><option value="32.2211,35.2544">نابلس</option><option value="31.9038,35.2034">رام الله</option><option value="31.7683,35.2137">القدس</option><option value="31.5017,34.4668">غزة</option><option value="31.5326,35.0998">الخليل</option><option value="32.4637,35.3000">جنين</option><option value="32.3104,35.0286">طولكرم</option></select><div style="display:grid;place-items:center;margin:28px"><div id="compass" style="width:210px;height:210px;border-radius:50%;border:10px solid #e6c26b;display:grid;place-items:center;background:radial-gradient(circle,#fff 0 55%,#eef5f2 56% 100%);font-size:58px;transition:transform .5s">🕋</div></div><h2 id="result" style="text-align:center"></h2><p id="note" style="text-align:center;color:#71807d"></p></section></main><script src="script.js"></script><script>const ka=[21.4225,39.8262];function calc(){const [lat,lon]=document.getElementById('city').value.split(',').map(Number),r=Math.PI/180,la1=lat*r,la2=ka[0]*r,d=(ka[1]-lon)*r,y=Math.sin(d)*Math.cos(la2),x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(d),b=(Math.atan2(y,x)/r+360)%360;document.getElementById('compass').style.transform='rotate('+b+'deg)';document.getElementById('result').textContent='اتجاه القبلة ≈ '+Math.round(b)+'° من الشمال';document.getElementById('note').textContent='القيمة تقريبية حسب مركز المدينة، وللدقة الميدانية استخدم بوصلة الهاتف بعد معايرتها.'}document.getElementById('city').onchange=calc;calc();</script></body></html>
