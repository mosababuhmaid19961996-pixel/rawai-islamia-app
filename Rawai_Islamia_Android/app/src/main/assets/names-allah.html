<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسماء الله الحسنى</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>أسماء الله الحسنى</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>✨ أسماء الله الحسنى</h1><p>أسماء ثابتة في القرآن والسنة مع معنى مختصر، دون نسبة قائمة غير ثابتة إلى حديث واحد.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث عن اسم"><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['الله','المعبود بحق وحده'],['الرحمن','واسع الرحمة'],['الرحيم','كثير الرحمة بعباده'],['الملك','مالك الملك والمتصرف فيه'],['القدوس','المنزه عن كل نقص'],['السلام','السالم من كل عيب ونقص'],['المؤمن','الذي يؤمّن عباده ويصدق رسله'],['المهيمن','الرقيب الحافظ'],['العزيز','الغالب الذي لا يُغلب'],['الجبار','العلي القاهر لجبر الكسير'],['الخالق','الذي خلق كل شيء'],['الغفور','كثير المغفرة'],['الرزاق','الذي يرزق خلقه'],['العليم','المحيط علمه بكل شيء'],['السميع','الذي يسمع كل شيء'],['البصير','الذي يرى كل شيء'],['الحكيم','المحكم لأفعاله وأحكامه'],['اللطيف','الرفيق بعباده العليم بدقائق الأمور'],['التواب','الذي يتوب على عباده'],['الشكور','الذي يثيب على القليل بالكثير']];function r(){let q=document.getElementById('q').value;list.innerHTML=a.filter(x=>x.join(' ').includes(q)).map(x=>'<article class="tool-card"><span>✨</span><b>'+x[0]+'</b><small>'+x[1]+'</small></article>').join('')}q.oninput=r;r();</script></body></html>
