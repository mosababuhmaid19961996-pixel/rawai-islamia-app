<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الصحابة والصحابيات</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>الصحابة والصحابيات</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🌿 الصحابة والصحابيات</h1><p>نبذة تعليمية عن شخصيات بارزة من أصحاب النبي ﷺ، مع تجنب الروايات غير الموثقة.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث عن صحابي أو صحابية"><div id="list"></div></main><script src="script.js"></script><script>const a=[['أبو بكر الصديق رضي الله عنه','أول الخلفاء الراشدين وصاحب النبي ﷺ في الهجرة، عُرف بالصدق وثباته بعد وفاة النبي ﷺ.'],['عمر بن الخطاب رضي الله عنه','ثاني الخلفاء الراشدين، اشتهر بالعدل والقوة في الحق.'],['عثمان بن عفان رضي الله عنه','ثالث الخلفاء الراشدين، ومن السابقين إلى الإسلام، وجُمع القرآن في عهده على المصحف الإمام.'],['علي بن أبي طالب رضي الله عنه','ابن عم النبي ﷺ وزوج فاطمة رضي الله عنها، ورابع الخلفاء الراشدين.'],['خديجة رضي الله عنها','أول زوجات النبي ﷺ وأول من آمن به، وكانت سندًا عظيمًا له في بداية الدعوة.'],['عائشة رضي الله عنها','أم المؤمنين، ومن أكثر الصحابة رواية للحديث، وكانت مرجعًا في العلم.'],['بلال بن رباح رضي الله عنه','من السابقين إلى الإسلام، وعُرف ببلال المؤذن وبثباته على التوحيد.'],['سلمان الفارسي رضي الله عنه','صحابي جليل، اشتهر برحلة طويلة في طلب الحق وباقتراح حفر الخندق.'],['مصعب بن عمير رضي الله عنه','من أوائل الدعاة إلى الإسلام في المدينة قبل الهجرة، وكان أول سفير للنبي ﷺ إليها.'],['أسماء بنت أبي بكر رضي الله عنها','من الصحابيات، وكان لها دور في الهجرة، ولُقبت بذات النطاقين.']];function r(){let q=document.getElementById('q').value;document.getElementById('list').innerHTML=a.filter(x=>x.join(' ').includes(q)).map(x=>'<article class="tool-section"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join('')}q.oninput=r;r();</script></body></html>
