<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النسخ الاحتياطي - روائع إسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><span class="logo-mark">⌂</span><span><b>روائع إسلامية</b><small>النسخ الاحتياطي</small></span></a></header><main class="inside tools-page"><a class="back" href="more.html">← مركز الأدوات</a><section class="section-hero tools-hero"><small>بياناتك</small><h1>☁️ نسخ احتياطي</h1><p>صدّر المفضلة والتقدم والإعدادات إلى ملف، ثم استعدها على جهاز آخر.</p></section><section class="tool-section"><button class="primary" onclick="exportData()">تصدير نسخة احتياطية</button><label class="primary" style="display:inline-block;margin:8px;cursor:pointer">استيراد نسخة احتياطية<input type="file" accept=".json,application/json" onchange="importData(this.files[0])" hidden></label><p id="msg"></p></section></main><script src="script.js"></script><script>const keys=['rawai-favorites','rawai-tasbih','rawai-wird-'+new Date().toISOString().slice(0,10),'rawai-khatma','rawai-adhkar-progress','rawai-auto-play','rawai-shuffle','rawai-repeat','rawai-dark','rawai-ach-played','rawai-ach-tasbih','rawai-ach-wird'];function exportData(){const d={version:1,created:new Date().toISOString(),data:{}};keys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)d.data[k]=v});const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rawai-islamia-backup.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('msg').textContent='تم إنشاء النسخة الاحتياطية.'}function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.data)throw 0;Object.entries(d.data).forEach(([k,v])=>{if(keys.includes(k))localStorage.setItem(k,String(v))});document.getElementById('msg').textContent='تم الاستيراد بنجاح. افتح الصفحة المطلوبة لرؤية التقدم.'}catch(e){document.getElementById('msg').textContent='الملف غير صالح.'}};r.readAsText(file)}</script></body></html>
