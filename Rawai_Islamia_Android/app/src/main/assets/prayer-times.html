<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواقيت الصلاة</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>مواقيت الصلاة</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🕌 مواقيت الصلاة</h1><p>اختر مدينة ثم احصل على المواقيت من خدمة مواقيت الصلاة.</p></section><select id="city"><option value="Nablus,Palestine">نابلس</option><option value="Ramallah,Palestine">رام الله</option><option value="Jerusalem,Palestine">القدس</option><option value="Hebron,Palestine">الخليل</option><option value="Gaza,Palestine">غزة</option></select><button class="primary" onclick="load()">تحديث المواقيت</button><div id="out" class="tool-section">اضغط تحديث.</div></main><script src="script.js"></script><script>async function load(){out.textContent='جارٍ التحميل...';try{let [c,country]=city.value.split(',');let d=new Date();let u='https://api.aladhan.com/v1/timingsByCity/'+String(d.getDate())+'-'+String(d.getMonth()+1)+'-'+d.getFullYear()+'?city='+encodeURIComponent(c)+'&country='+encodeURIComponent(country)+'&method=2';let j=await fetch(u).then(x=>x.json());let t=j.data.timings;out.innerHTML='<h2>'+c+'</h2><p>الفجر: '+t.Fajr+' | الشروق: '+t.Sunrise+'</p><p>الظهر: '+t.Dhuhr+' | العصر: '+t.Asr+'</p><p>المغرب: '+t.Maghrib+' | العشاء: '+t.Isha+'</p>'}catch(e){out.textContent='تعذر جلب المواقيت الآن.'}}</script></body></html>
