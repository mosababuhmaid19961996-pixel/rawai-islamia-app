<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصطلحات الإسلامية</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>المصطلحات الإسلامية</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📚 موسوعة المصطلحات الإسلامية</h1><p>قاموس مختصر للمصطلحات الأساسية.</p></section><input id="q" class="video-search" placeholder="🔎 ابحث عن مصطلح"><div id="list"></div></main><script src="script.js"></script><script>const a=[['التقوى','امتثال أوامر الله واجتناب نواهيه مع مراقبته وخشيته.'],['الإحسان','أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك.'],['الخشوع','حضور القلب وخضوعه لله في العبادة.'],['الزكاة','عبادة مالية واجبة بشروطها في أموال مخصوصة.'],['الصدقة','ما يبذله المسلم من خير، وتشمل الصدقة المالية وغيرها من وجوه البر.'],['الفتوى','بيان الحكم الشرعي في مسألة، ويحتاج إلى علم وتأهل.'],['السنة','ما ثبت عن النبي ﷺ من قول أو فعل أو تقرير أو صفة.'],['البدعة','ما أُحدث في الدين مما ليس له أصل شرعي، وتفاصيل التعريف والتطبيق تحتاج إلى علم.'],['الفرض','ما طلب الشرع فعله طلبًا جازمًا.'],['المباح','ما خُيّر المكلف بين فعله وتركه من حيث الأصل.']];function r(){let q=document.getElementById('q').value;document.getElementById('list').innerHTML=a.filter(x=>x.join(' ').includes(q)).map(x=>'<article class="tool-section"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join('')}q.oninput=r;r();</script></body></html>
