<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أحكام الجنائز</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>أحكام الجنائز</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>⚰️ أحكام الجنائز</h1><p>مقدمة تعليمية مختصرة، مع إحالة التفاصيل الفقهية إلى أهل العلم.</p></section><div id="list"></div></main><script src="script.js"></script><script>const a=[['عند الاحتضار','الدعاء للمحتضر وتذكيره بالشهادة برفق، وتجنب التكلف أو إيذائه.'],['بعد الوفاة','إغماض عينيه والدعاء له، ثم المبادرة إلى التجهيز وفق الأحكام.'],['الغسل والكفن','تجهيز الميت بالغسل والتكفين على الصفة الشرعية المعروفة.'],['صلاة الجنازة','صلاة مخصوصة على الميت لها تكبيرات ودعاء.'],['الدفن','دفن الميت وإكرامه والدعاء له بعد الدفن.'],['التعزية','مواساة أهل الميت والدعاء لهم، وتجنب ما لا أصل له من عادات محرمة.']];document.getElementById('list').innerHTML=a.map((x,i)=>'<article class="tool-section"><h2>'+(i+1)+'. '+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');</script></body></html>
