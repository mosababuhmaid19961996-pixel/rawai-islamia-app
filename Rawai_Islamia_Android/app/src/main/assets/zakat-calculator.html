<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة الزكاة</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>حاسبة الزكاة</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>🧮 حاسبة الزكاة</h1><p>حاسبة تعليمية تقريبية للنقد الذي تجب فيه الزكاة بعد تحقق شروطها وبلوغ النصاب وحولان الحول.</p></section><div class="tool-section"><label>المبلغ الخاضع للزكاة</label><input id="amount" type="number" min="0" inputmode="decimal" placeholder="0"><button class="primary" onclick="calc()">احسب 2.5%</button><h2 id="out">الزكاة: 0</h2><small>هذه أداة حسابية وليست فتوى؛ مسائل الذهب والديون والعروض وغيرها تحتاج سؤال أهل العلم.</small></div></main><script src="script.js"></script><script>function calc(){const n=Number(amount.value)||0;out.textContent='الزكاة: '+(n*.025).toFixed(2)}</script></body></html>
