<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قصص الأنبياء</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html"><b>روائع إسلامية</b><small>قصص الأنبياء</small></a></header><main class="inside"><a class="back" href="index.html">← الرئيسية</a><section class="section-hero"><h1>📖 قصص الأنبياء</h1><p>ملخصات مرتبطة بمواضع القرآن، مع عدم إضافة تفاصيل غير ثابتة إلى القصة.</p></section><div id="list" class="tools-grid"></div></main><script src="script.js"></script><script>const a=[['آدم عليه السلام','خلق الله آدم وأسكنه الجنة ثم ابتلاه، وتاب عليه.','البقرة 30-39'],['نوح عليه السلام','دعا قومه إلى توحيد الله زمنًا طويلًا، ونجاه الله ومن آمن معه في السفينة.','هود 25-49'],['إبراهيم عليه السلام','دعا إلى التوحيد وحاج قومه وكسر الأصنام، وابتلاه الله فنجاه.','الأنبياء 51-70'],['يوسف عليه السلام','مر بابتلاءات متعددة ثم مكّن الله له في الأرض، وكان من أعظم دروس قصته الصبر والعفو.','يوسف 1-111'],['موسى عليه السلام','أرسله الله إلى فرعون، وأيده بالآيات، ونجى بني إسرائيل.','طه 9-79'],['يونس عليه السلام','ابتلاه الله ثم نجاه بعد دعائه في الظلمات.','الأنبياء 87-88'],['أيوب عليه السلام','ضرب مثلًا في الصبر، ثم كشف الله ضره وآتاه أهله ومثلهم معهم.','الأنبياء 83-84'],['عيسى عليه السلام','أرسله الله إلى بني إسرائيل وآتاه البينات وأيده بروح القدس.','آل عمران 45-55']];document.getElementById('list').innerHTML=a.map(x=>'<article class="tool-card"><span>📖</span><b>'+x[0]+'</b><small>'+x[1]+'<br>📌 '+x[2]+'</small></article>').join('');</script></body></html>
